name: Publish packages

on:
  push:
    branches:
      - main

jobs:
  publish-packages:
    if: contains(github.event.head_commit.message, 'publish new release')
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        uses: changesets/action@v2
        id: changesets
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          version-script: pnpm version
          publish-script: pnpm tag
    outputs:
      ref: ${{ github.ref }}
      published: ${{ steps.changesets.outputs.published }}

  deliver-packages:
    name: Deliver packages
    uses: ./.github/workflows/registries.yml
    needs: publish-packages
    permissions:
      id-token: write
      contents: read
    with:
      ref: ${{ needs.publish-packages.outputs.ref }}
    secrets: inherit
    if: ${{ needs.publish-packages.outputs.published }}
